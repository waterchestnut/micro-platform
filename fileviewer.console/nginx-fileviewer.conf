upstream fileviewer_console
{
	server 127.0.0.1:10017;
}

upstream fileviewer_ucenter
{
	server 127.0.0.1:12001;
}

map $http_upgrade $connection_upgrade {
	default          keep-alive;
	'websocket'      upgrade;
}

server {
	listen       11017;
	server_name  localhost;

	access_log  logs/host.access.fileviewer.console.log  main;

	# 独立访问时的 SSO/代理路径转发到 ucenter.api
	location ~ ^/(client-proxy|wxmp|oauth)/ {
		proxy_pass         http://fileviewer_ucenter;
		proxy_set_header   X-Real-IP            $remote_addr;
		proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
		proxy_set_header   Host                   $http_host;
		proxy_set_header   X-NginX-Proxy    true;
		proxy_set_header   protocol    "http";
		proxy_set_header   client-code    "fileviewer";
		proxy_redirect     off;
		proxy_connect_timeout 10;
		proxy_send_timeout 100;
		proxy_read_timeout 200;
	}

	location / {
		proxy_pass         http://fileviewer_console;
		proxy_set_header   X-Real-IP            $remote_addr;
		proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
		proxy_set_header   Host                   $http_host;
		proxy_set_header   X-NginX-Proxy    true;
		proxy_set_header   protocol    "http";
		proxy_set_header   client-code    "fileviewer";
		proxy_set_header   request-uri    $request_uri;
		proxy_redirect     off;
		proxy_connect_timeout 10;
		proxy_send_timeout 100;
		proxy_read_timeout 200;

		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		if ($http_origin ~* "^https?://((?:.*\.jtxuexi\.com)|(?:localhost(?::\d*)?))$") {
			set $cors "true";
		}
		if ($cors = "true") {
			add_header Access-Control-Allow-Origin '$http_origin' always;
			add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
		}
		proxy_hide_header Access-Control-Allow-Origin;
		proxy_hide_header Access-Control-Allow-Methods;
		proxy_hide_header X-Powered-By;
		add_header Content-Security-Policy "default-src 'self' *.jtxuexi.com localhost:* 'unsafe-inline' 'unsafe-eval' blob: data: ;";
	}

	error_page   500 502 503 504  /50x.html;
	location = /50x.html {
		root   html;
	}
}
