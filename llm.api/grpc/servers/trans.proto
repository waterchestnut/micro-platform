// 使用proto3语法，默认proto2
syntax = "proto3";

// 是否需要生成的类拆分为多个
option java_multiple_files = true;
// 生成的类所属的层级
option java_package = "llm.grpc.trans";
option java_outer_classname = "TransProto";
option objc_class_prefix = "LLM";

// 定义包名，避免命名冲突
package llm;

// 定义服务
service Trans {
  rpc autoTrans (autoTransRequest) returns (autoTransResponse) {}
  rpc nonChineseTrans (nonChineseTransRequest) returns (nonChineseTransResponse) {}
}

// 结构化数据：使用message定义。
// 字段类型 字段名 = 字段编号;
message autoTransRequest {
  string sourceText = 1;
}

message autoTransResponse {
  string transText = 1;
}

message nonChineseTransRequest {
  string sourceText = 1;
  bool onlyFull = 2;
}

message sentenceItem {
  string original = 1;
  string translation = 2;
}

message nonChineseTransResponse {
  string fullTrans = 1;
  repeated sentenceItem sentenceTrans = 2;
}