// 使用proto3语法，默认proto2
syntax = "proto3";

// 是否需要生成的类拆分为多个
option java_multiple_files = true;
// 生成的类所属的层级
option java_package = "llm.grpc.grpcSkillExecutor";
option java_outer_classname = "GrpcSkillExecutorProto";
option objc_class_prefix = "LLM";

// 定义包名，避免命名冲突
package llm;

// 定义服务
service GrpcSkillExecutor {
  rpc execSkillCommand (execSkillCommandRequest) returns (execSkillCommandResponse) {}
}

// 结构化数据：使用message定义。
// 字段类型 字段名 = 字段编号;
message execSkillCommandRequest {
  string skillName = 1;
  string commandName = 2;
  string params = 3;
  string curUserInfo = 4;
}

message execSkillCommandResponse {
  uint32 code = 1;
  string data = 2;
  string msg = 3;
}