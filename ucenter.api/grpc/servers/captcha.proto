// 使用proto3语法，默认proto2
syntax = "proto3";

// 是否需要生成的类拆分为多个
option java_multiple_files = true;
// 生成的类所属的层级
option java_package = "ucenter.grpc.captcha";
option java_outer_classname = "CaptchaProto";
option objc_class_prefix = "UCENTER";

// 定义包名，避免命名冲突
package ucenter;

// 定义服务
service Captcha {
  rpc checkCaptcha (CheckCaptchaRequest) returns (CheckCaptchaResponse) {}
  rpc checkSmsCode (CheckSmsCodeRequest) returns (CheckSmsCodeResponse) {}
  rpc checkEmailCode (CheckEmailCodeRequest) returns (CheckEmailCodeResponse) {}
}

// 结构化数据：使用message定义。
// 字段类型 字段名 = 字段编号;
message CheckCaptchaRequest {
  string captchaKey = 1;
  string captcha = 2;
}

message CheckCaptchaResponse {
  bool checked = 1;
}

message CheckSmsCodeRequest {
  string mobile = 1;
  string smsCode = 2;
}

message CheckSmsCodeResponse {
  bool checked = 1;
}

message CheckEmailCodeRequest {
  string email = 1;
  string emailCode = 2;
}

message CheckEmailCodeResponse {
  bool checked = 1;
}