// 使用proto3语法，默认proto2
syntax = "proto3";

// 是否需要生成的类拆分为多个
option java_multiple_files = true;
// 生成的类所属的层级
option java_package = "ucenter.grpc.region";
option java_outer_classname = "RegionProto";
option objc_class_prefix = "UCENTER";

// 定义包名，避免命名冲突
package ucenter;

// 定义服务
service Region {
  rpc searchRegion (SearchRegionRequest) returns (SearchRegionResponse) {}
}

// 结构化数据：使用message定义。
// 字段类型 字段名 = 字段编号;
message SearchRegionRequest {
  string regionName = 1;
  int32 levelNum = 2;
}

message SearchRegionResponse {
  string regions = 1;
}